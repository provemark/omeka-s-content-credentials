# The checks of `composer check`, on the PHP versions the module supports,
# then the integration tests against the Docker environment of tools/env/.
# No continue-on-error: a red job is a red run.
name: ci

on:
  push:
  pull_request:

# The jobs only read the repository; a pull request from anyone gets no more.
permissions:
  contents: read

jobs:
  static-and-unit:
    name: static checks and unit tests (PHP ${{ matrix.php }})
    # Pinned, not ubuntu-latest, as in the sister projects: a runner change
    # should be a commit of its own.
    runs-on: ubuntu-24.04
    strategy:
      # Let every version finish: one red version must not hide another.
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Omeka S release zip, downloaded from GitHub releases once and kept
      # between runs, so that a GitHub download outage does not turn a run red
      # (notes/step-51-caching-downloads.md). tools/fetch-omeka.sh checks its
      # SHA-256 and downloads it only when it is missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.tools/omeka-s-*.zip
          key: omeka-s-${{ hashFiles('docker/omeka/Dockerfile') }}
          restore-keys: omeka-s-

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring, sodium
          coverage: none

      - run: composer validate --strict

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      # composer.lock is committed (the release zip is built from it), so this
      # installs exactly what is locked.
      - run: composer install --no-interaction --prefer-dist --no-progress

      # composer check without its last step, the integration tests, which
      # run in their own job below.
      - run: composer spec-check
      - run: composer lint
      - run: composer analyse
      - run: composer deptrac
      - run: composer test

  integration:
    name: integration tests (Omeka S 4.2.1 on PHP 8.3 and 8.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Omeka S release zip, downloaded from GitHub releases once and kept
      # between runs, so that a GitHub download outage does not turn a run red
      # (notes/step-51-caching-downloads.md). tools/fetch-omeka.sh checks its
      # SHA-256 and downloads it only when it is missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.tools/omeka-s-*.zip
          key: omeka-s-${{ hashFiles('docker/omeka/Dockerfile') }}
          restore-keys: omeka-s-

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      # Builds both images from the pinned release and digests, installs
      # Omeka S in both, then runs tests/Integration (SPEC-001).
      - run: composer test:integration

      - if: failure()
        run: docker compose logs --no-color

  # SPEC-008: the zip, built on Linux, in a clean Omeka S: its own tests, then
  # the whole of tests/Integration on it (AC8).
  release:
    name: the release zip (built on PHP 8.3, in Omeka S 4.2.1 on PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Omeka S release zip, downloaded from GitHub releases once and kept
      # between runs, so that a GitHub download outage does not turn a run red
      # (notes/step-51-caching-downloads.md). tools/fetch-omeka.sh checks its
      # SHA-256 and downloads it only when it is missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.tools/omeka-s-*.zip
          key: omeka-s-${{ hashFiles('docker/omeka/Dockerfile') }}
          restore-keys: omeka-s-

      # The Strauss phar, likewise; tools/build.sh checks its SHA-256. A cache
      # of its own: a key is saved once, by the first job to finish, and the
      # other jobs have no Strauss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.tools/strauss-*.phar
          key: strauss-${{ hashFiles('tools/build.sh') }}
          restore-keys: strauss-

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: sh tools/env/release.sh --php ${{ matrix.php }}

      - run: sh tools/env/release.sh --integration --php ${{ matrix.php }}

  # ADR-0001: Omeka S 4.2 loads Module.php on PHP 8.1 and 8.2, and on a
  # refused install also src/Requirements.php, before the module can say it
  # needs 8.3. And a module already installed on a PHP that is later
  # downgraded runs src/ to record `error` / `requirements` (SPEC-002 AC12).
  # So all of it must parse there; the verifier itself need not.
  parse-on-older-php:
    name: parses on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: |
          for file in Module.php config/module.config.php $(find src -name '*.php' | sort); do
            php -l "$file"
          done
