# M7.1 probe, never shipped: a clean Omeka S 4.2.1 on PHP 8.3 and on 8.2, with
# no module mounted. A zip is unpacked into modules/ as an administrator would.
# Its own project, volumes and ports: the test environment is not touched.
name: content-credentials-zip

x-db: &db
  image: mariadb:11.4@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
  environment:
    MARIADB_DATABASE: omeka
    MARIADB_USER: omeka
    MARIADB_PASSWORD: omeka
    MARIADB_ROOT_PASSWORD: root
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 2s
    timeout: 5s
    retries: 30

x-omeka-environment: &omeka-environment
  OMEKA_ROOT: /var/www/html
  OMEKA_DB_NAME: omeka
  OMEKA_DB_USER: omeka
  OMEKA_DB_PASSWORD: omeka
  OMEKA_ADMIN_EMAIL: admin@example.com
  OMEKA_ADMIN_PASSWORD: test-only-admin-password

services:
  db:
    <<: *db
    volumes:
      - db:/var/lib/mysql
  omeka:
    image: content-credentials-test/omeka:4.2.1-php8.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *omeka-environment
      OMEKA_DB_HOST: db
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - files:/var/www/html/files
  db-php82:
    <<: *db
    volumes:
      - db-php82:/var/lib/mysql
  omeka-php82:
    image: content-credentials-test/omeka:4.2.1-php8.2
    depends_on:
      db-php82:
        condition: service_healthy
    environment:
      <<: *omeka-environment
      OMEKA_DB_HOST: db-php82
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - files-php82:/var/www/html/files

volumes:
  db:
  files:
  db-php82:
  files-php82:
