[info]
name                     = "Content Credentials (C2PA)"
version                  = "0.1.5"
author                   = "Maurice van Loon"
author_link              = "https://github.com/provemark"
module_link              = "https://github.com/provemark/omeka-s-content-credentials"
description              = "Verifies the Content Credentials (C2PA) of uploaded media and shows the result in the admin interface. Checks only: never signs, never blocks an upload, opens no network connection. Uninstalling deletes every verdict and evidence document it has stored."
omeka_version_constraint = "^4.2.1"
; SPEC-004 AC11: Omeka shows the Configure link only for a configurable module.
configurable             = true
