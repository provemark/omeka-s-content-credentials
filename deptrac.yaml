# Architecture boundaries for src/, one layer per milestone, each added
# before the first file in it (so that file lands under a rule instead of
# before one). Adding an arrow between layers is a decision that belongs in
# the spec of the code that needs it. Deptrac does not itself flag a file in
# no layer (notes/step-07-composer-check.md): keeping every file in a layer
# is a rule of review.
deptrac:
  paths:
    - ./src
  layers:
    - name: Requirements   # M0, SPEC-001: what the server must offer; runs on the PHP it refuses, depends on nothing
      collectors:
        - type: classLike
          value: ^ContentCredentials\\Requirements$
    - name: Check          # M1, SPEC-002: from a file to a verdict, and recording it; no Omeka S
      collectors:
        - type: classLike
          value: ^ContentCredentials\\Check\\
    - name: Entity         # M1, SPEC-002 / ADR-0003: the table, as Doctrine maps it
      collectors:
        - type: classLike
          value: ^ContentCredentials\\Entity\\
    - name: Omeka          # M1, SPEC-002: the wiring into Omeka S (events, store, schema, loader)
      collectors:
        - type: classLike
          value: ^ContentCredentials\\Omeka\\
  ruleset:
    Requirements: []
    Check: [Requirements]
    Entity: []
    Omeka: [Check, Entity, Requirements]
